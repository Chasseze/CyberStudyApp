<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8f0f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="#0f1e2e" stroke="#4a9eff" stroke-width="3"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="50" r="8" fill="#e8f0f7"/>
  <circle cx="200" cy="350" r="8" fill="#e8f0f7"/>
  
  <!-- Decorative lines -->
  <line x1="80" y1="120" x2="120" y2="100" stroke="#4a9eff" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="100" x2="320" y2="120" stroke="#4a9eff" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="280" x2="120" y2="300" stroke="#4a9eff" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="300" x2="320" y2="280" stroke="#4a9eff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Globe -->
  <circle cx="200" cy="180" r="110" fill="url(#globeGradient)" stroke="#6bb6ff" stroke-width="2"/>
  
  <!-- Globe grid lines (longitude) -->
  <line x1="200" y1="70" x2="200" y2="290" stroke="#1a3a52" stroke-width="1.5" opacity="0.6"/>
  <line x1="155" y1="75" x2="245" y2="285" stroke="#1a3a52" stroke-width="1.5" opacity="0.6"/>
  <line x1="245" y1="75" x2="155" y2="285" stroke="#1a3a52" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Globe grid lines (latitude) -->
  <ellipse cx="200" cy="180" rx="110" ry="30" fill="none" stroke="#1a3a52" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="200" cy="180" rx="110" ry="70" fill="none" stroke="#1a3a52" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Banner -->
  <path d="M 100 240 Q 200 220 300 240 L 300 300 Q 200 320 100 300 Z" fill="url(#bannerGradient)" stroke="#1a3a52" stroke-width="2.5"/>
  
  <!-- Text on banner -->
  <text x="200" y="285" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#1a3a52" text-anchor="middle" letter-spacing="2">CHASSZE</text>
</svg>